[package]
name = "drasi_ffi"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "C ABI host embedding the Drasi continuous-query engine for .NET"
license = "Apache-2.0"
repository = "https://github.com/drasi-project/drasi-dotnet"
publish = false

[lib]
name = "drasi_ffi"
crate-type = ["cdylib"]

[dependencies]
# These versions match drasi-python / drasi-nodejs. The Drasi workspace versions
# its crates independently; published plugins later must match major.minor.
drasi-lib = { version = "=0.8.9", features = [
    "middleware-decoder",
    "middleware-map",
    "middleware-parse-json",
    "middleware-promote",
    "middleware-relabel",
    "middleware-unwind",
] }
drasi-core = "=0.5.7"
drasi-host-sdk = { version = "=0.10.0", features = ["watcher", "registry"] }
drasi-plugin-sdk = "=0.10.0"
drasi-state-store-redb = "=0.2.4"
drasi-index-rocksdb = { version = "=0.5.8", features = ["plugin-descriptor"] }

anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time", "fs"] }
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
