# Produce RID-specific native libraries and pack them into the Drasi nupkg.
#
# Every target is built on a matching native runner except osx-x64, which is
# cross-compiled on macos-14 (Apple Silicon) because macos-13 Intel runners
# stay queued. Linux jobs are pinned to Ubuntu 22.04 (glibc 2.35).
#
# workflow_dispatch and PRs build + pack + verify load. A v*.*.* tag also
# publishes to nuget.org (Trusted Publishing) and creates a GitHub Release.

name: Native binaries

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-binaries-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: windows-latest
            rid: win-x64
            rust_target: x86_64-pc-windows-msvc
            artifact: drasi_ffi.dll
          - host: ubuntu-22.04
            rid: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            artifact: libdrasi_ffi.so
          - host: ubuntu-22.04-arm
            rid: linux-arm64
            rust_target: aarch64-unknown-linux-gnu
            artifact: libdrasi_ffi.so
          - host: macos-14
            rid: osx-x64
            rust_target: x86_64-apple-darwin
            artifact: libdrasi_ffi.dylib
          - host: macos-14
            rid: osx-arm64
            rust_target: aarch64-apple-darwin
            artifact: libdrasi_ffi.dylib
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4

      - name: Install libclang for rocksdb bindgen (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - name: Point bindgen at LLVM (Windows)
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
        shell: pwsh

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build native library
        run: cargo build --release --manifest-path native/Cargo.toml --target ${{ matrix.rust_target }}

      - name: Stage RID layout
        shell: bash
        run: |
          mkdir -p staging/runtimes/${{ matrix.rid }}/native
          src="native/target/${{ matrix.rust_target }}/release/${{ matrix.artifact }}"
          cp "$src" "staging/runtimes/${{ matrix.rid }}/native/${{ matrix.artifact }}"
          ls -la "staging/runtimes/${{ matrix.rid }}/native"

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: staging
          if-no-files-found: error

  pack:
    name: Pack NuGet
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: native-*
          merge-multiple: true

      - name: Show staged runtimes
        run: find artifacts -type f | sort

      - name: Resolve package version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack
        run: |
          mkdir -p nupkgs
          dotnet pack src/Drasi/Drasi.csproj -c Release -o nupkgs \
            -p:NativeAssetsDir=$(pwd)/artifacts/runtimes \
            -p:Version=${{ steps.version.outputs.version }}
          unzip -l nupkgs/*.nupkg | grep -E 'runtimes/|drasi_ffi' || true

      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: |
            nupkgs/*.nupkg
            nupkgs/*.snupkg
          if-no-files-found: error

  verify-load:
    name: Verify load ${{ matrix.rid }}
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: windows-latest
            rid: win-x64
          - host: ubuntu-22.04
            rid: linux-x64
          - host: ubuntu-22.04-arm
            rid: linux-arm64
          - host: macos-14
            rid: osx-arm64
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/download-artifact@v4
        with:
          name: nuget
          path: nupkgs

      - name: Consume package without a Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p consume
          cat > consume/Consume.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <RollForward>LatestMajor</RollForward>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
          </Project>
          EOF
          cat > consume/Program.cs <<'EOF'
          using Drasi;
          var engine = await Engine.CreateAsync("nuget-load");
          Console.WriteLine(engine.Id);
          await engine.DisposeAsync();
          EOF
          cat > nuget.config <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="./nupkgs" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF
          dotnet add consume/Consume.csproj package Drasi --version ${{ needs.pack.outputs.version }}
          dotnet run --project consume/Consume.csproj -c Release

  publish:
    name: Publish nuget.org
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [pack, verify-load]
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/download-artifact@v4
        with:
          name: nuget
          path: nupkgs

      - name: Require NUGET_USER
        run: |
          if [ -z "${{ vars.NUGET_USER }}" ]; then
            echo "Set repository variable NUGET_USER to the nuget.org username (not email)." >&2
            exit 1
          fi

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push nupkg and snupkg
        run: |
          shopt -s nullglob
          packages=(nupkgs/*.nupkg nupkgs/*.snupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "no packages to push" >&2
            exit 1
          fi
          dotnet nuget push "nupkgs/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          if compgen -G "nupkgs/*.snupkg" > /dev/null; then
            dotnet nuget push "nupkgs/*.snupkg" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          fi

      - name: Release notes from CHANGELOG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = Path("CHANGELOG.md").read_text()
          pattern = rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)"
          match = re.search(pattern, text, re.M | re.S)
          notes = match.group(1).strip() if match else f"Drasi {version}"
          Path("RELEASE_NOTES.md").write_text(notes + "\n")
          PY

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" nupkgs/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
